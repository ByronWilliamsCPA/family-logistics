# Pre-commit hooks configuration
# See https://pre-commit.com for more information
#
# Hook stages:
# - pre-commit: Fast checks on every commit (formatting, lint, types, secrets)
# - pre-push: Full scans (bandit over src/, detect-secrets baseline regression)
# - commit-msg: Conventional commit message validation
#
# Python tools (ruff, basedpyright, bandit, pydoclint, interrogate, yamllint,
# detect-secrets) run as local `uv run --no-sync` hooks, so their versions come
# from uv.lock: one source of truth, kept current by Renovate lock maintenance.
# Run `uv sync --all-extras` before `uv run pre-commit install`.
#
# Hooks fail closed: there are no `command -v ... || echo` skip shims. The one
# deliberate exception is private-terms, which warns and passes when no
# deny-list is configured (a contributor without the list cannot run it); CI
# runs it with --require-list, and owners set FL_PRIVATE_TERMS_REQUIRED=1.
# Remote `rev:` values are commit SHAs, updated by Renovate (the custom regex
# manager in renovate.json reads the tag from the trailing comment).

default_install_hook_types: [pre-commit, commit-msg, pre-push]

ci:
  autoupdate_schedule: monthly
  autofix_prs: true
  # Renovate is the only intended source of rev updates. If the pre-commit.ci
  # app is installed, turn off its autoupdate PRs in the app settings: this file
  # cannot disable them, and they rewrite rev: to a tag, undoing the SHA pins.
  #
  # The hooks below are skipped on pre-commit.ci because they need the uv
  # environment or inputs outside the repository. They run on a contributor's
  # machine and in the "Pre-commit Hooks" job of .github/workflows/ci.yml
  # (pre-commit and pre-push stages, required through CI Gate). private-terms
  # skips there without its list; Private Data Guard enforces it with the
  # secret, alongside gitleaks.
  skip:
    - validate-front-matter
    - private-terms
    - detect-secrets
    - bandit
    - bandit-full
    - ruff
    - ruff-format
    - basedpyright
    - yamllint
    - interrogate
    - pydoclint

repos:
  # ============================================================================
  # Fast File Checks (Lightweight, run on every commit)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 2c9f875913ee60ca25ce70243dc24d5b6415598c  # v4.6.0  # pragma: allowlist secret
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
        exclude: mkdocs.yml  # Exclude mkdocs.yml due to !ENV custom tags
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=10000']  # 10MB limit
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]

  # ============================================================================
  # Secret and household-data guards (this repository is PUBLIC)
  # ============================================================================
  # gitleaks: staged-change gate at pre-commit. Default secret rules plus
  # .gitleaks.toml rules for private IPs, personal e-mail, phone numbers and
  # street addresses. CI scans full history separately.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1  # pragma: allowlist secret
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      # Real names and places: the deny-list lives outside the repository
      # (~/.config/family-logistics/private-terms.txt locally, FL_PRIVATE_TERMS
      # in CI). With no list the hook warns and passes so contributors without
      # the list can commit; CI is the enforcement point. Owners set
      # FL_PRIVATE_TERMS_REQUIRED=1 to make the local hook fail closed.
      # verbose: true shows that warning, because pre-commit hides the output of
      # passing hooks. All file types are scanned (the checker also reads
      # non-UTF-8 and binary files). Commit messages and history are scanned by
      # the CI job, not here.
      - id: private-terms
        name: Private household terms
        entry: python3 scripts/check_private_terms.py
        language: system
        verbose: true
        stages: [pre-commit]

      # detect-secrets: baseline-regression layer at pre-push, where the tree is
      # clean (pre-commit's auto-stash shifts line numbers in a whole-tree
      # baseline). After auditing new hits, regenerate with:
      #   uv run detect-secrets scan --baseline .secrets.baseline
      - id: detect-secrets
        name: detect-secrets (baseline regression)
        entry: uv run --no-sync detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^(uv\.lock|\.secrets\.baseline)$
        stages: [pre-push]

  # ============================================================================
  # Security Scanning - Bandit (locked version via uv)
  # ============================================================================
  # Configuration in pyproject.toml [tool.bandit]
  - repo: local
    hooks:
      - id: bandit
        name: Bandit Security Scan (changed files, medium+)
        entry: uv run --no-sync bandit -c pyproject.toml -ll
        language: system
        types: [python]
        stages: [pre-commit]
        exclude: ^(tests|scripts|tools)/
      - id: bandit-full
        name: Bandit Security Scan (full src/)
        entry: uv run --no-sync bandit -c pyproject.toml -r src/ -ll -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ============================================================================
  # Conventional Commits Enforcement
  # ============================================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: fab6a95091c567b872099a98cad586c122f55dc8  # v3.6.0  # pragma: allowlist secret
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  # ============================================================================
  # pyproject.toml and GitHub Workflow Validation
  # ============================================================================
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3  # 0.26  # pragma: allowlist secret
    hooks:
      - id: validate-pyproject
        stages: [pre-commit]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049  # 0.38.2  # pragma: allowlist secret
    hooks:
      - id: check-github-workflows
        stages: [pre-commit]

  # ============================================================================
  # Ruff, BasedPyright, YAML lint, docstrings (locked versions via uv)
  # ============================================================================
  # Qlty still runs in CI (.github/workflows/qlty.yml). The former local qlty
  # hooks skipped silently when qlty was not installed, so they were removed;
  # the tools they wrapped run directly below.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff (format)
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: basedpyright
        name: basedpyright (strict, src/)
        entry: uv run --no-sync basedpyright src/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
      - id: yamllint
        name: yamllint
        entry: uv run --no-sync yamllint --strict -c .yamllint
        language: system
        types: [yaml]
        stages: [pre-commit]
      - id: interrogate
        name: interrogate (docstring coverage, src/)
        entry: uv run --no-sync interrogate -v -c pyproject.toml src/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
      - id: pydoclint
        name: pydoclint
        entry: uv run --no-sync pydoclint --config=pyproject.toml
        language: system
        types: [python]
        stages: [pre-commit]
        exclude: ^(tests|scripts|tools)/

  # ============================================================================
  # Markdown and house style
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # v0.49.1  # pragma: allowlist secret
    hooks:
      - id: markdownlint
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: no-em-dash
        name: No em dashes (house style)
        entry: '\xe2\x80\x94'  # UTF-8 bytes of U+2014; pygrep matches bytes, and this file never contains the character
        language: pygrep
        types: [text]
        stages: [pre-commit]

  # ============================================================================
  # Custom Documentation Validation
  # ============================================================================
  - repo: local
    hooks:
      - id: validate-front-matter
        name: Validate documentation front matter
        entry: python tools/validate_front_matter.py docs
        language: python
        files: ^docs/(?!planning/).*\.md$
        pass_filenames: false
        stages: [pre-commit]
        additional_dependencies:
          - python-frontmatter>=1.1.0
          - pydantic>=2.0
          - ruamel.yaml>=0.18

# Exclude patterns
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      build/|
      dist/|
      .*\.egg-info/|
      __pycache__/|
      \.mypy_cache/|
      \.pytest_cache/|
      \.ruff_cache/|
      data/|
      models/|
      .*\.pyc
  )$

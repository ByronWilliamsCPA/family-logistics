# Dependency Review - Analyzes dependency changes in PRs
# Checks for vulnerabilities and license compliance
#
# Features:
#   - Vulnerability detection in dependency changes
#   - License compliance checking
#   - Blocks PRs with high severity vulnerabilities
name: Dependency Review

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Deny copyleft and restrictive licenses (deny-list approach)
          deny-licenses: >-
            AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0, GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0, LGPL-3.0-only, LGPL-3.0-or-later
          # text-unidecode is CI tooling only (cruft, via cookiecutter and
          # python-slugify), never shipped. It is licensed Artistic-1.0-Perl OR
          # GPL-1.0-only OR GPL-2.0-or-later; the Artistic-1.0-Perl option is
          # the one relied on.
          allow-dependencies-licenses: pkg:pypi/text-unidecode
          comment-summary-in-pr: on-failure

# Mutation Testing for Family Logistics
# Validates test effectiveness by introducing code mutations.
#
# This is a thin caller to the org-level reusable workflow.
#
# Documentation: https://mutmut.readthedocs.io/
name: Mutation Testing

on:
  # Weekly schedule - Saturdays at 02:37 UTC
  schedule:
    - cron: '37 2 * * 6'
  # Manual trigger with configurable threshold
  workflow_dispatch:
    inputs:
      mutation_threshold:
        description: 'Minimum mutation score threshold (%)'
        required: false
        default: '80'
        type: string
# Cancel in-progress runs for the same ref
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Testing
    # The reusable job declares pull-requests: write, so the caller must grant it
    # even though post-pr-comment is false and no PR run exists.
    permissions:
      contents: read
      pull-requests: write
    uses: ByronWilliamsCPA/.github/.github/workflows/python-mutation.yml@82ce497cae146787ea65bf892aedfe3262a4638e  # main
    with:
      python-version: '3.12'
      source-directory: 'src'
      test-directory: 'tests'
      mutation-threshold: ${{ inputs.mutation_threshold && fromJSON(inputs.mutation_threshold) || 80 }}
      fail-under-threshold: ${{ github.event_name != 'schedule' }}
      # Schedule and manual runs only, so there is no PR to comment on.
      post-pr-comment: false
      timeout-minutes: 60

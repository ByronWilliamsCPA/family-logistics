---
# OpenSSF Scorecard
# Runs ossf/scorecard-action directly rather than through the org reusable
# workflow: the Scorecard webapp only accepts published results from a
# workflow that calls the action itself, and the reusable workflow always sets
# publish_results: false. Publishing is what makes this public repository's
# score appear on api.securityscorecards.dev and the Scorecard badge.
#
# scorecard-action restricts this workflow: one job, top-level permissions
# read-only, no env/defaults blocks, and only checkout, harden-runner,
# scorecard-action, upload-artifact and upload-sarif steps.
name: OpenSSF Scorecard

"on":
  branch_protection_rule:
  schedule:
    - cron: '21 21 * * 2'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

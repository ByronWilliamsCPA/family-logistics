---
# Security Analysis Workflow
# Runs security scans including Bandit and dependency checks.
#
# Features:
#   - Bandit static analysis for Python
#   - OSV-Scanner dependency vulnerability scanning
#   - Weekly scheduled scans
#
# Not run here: CodeQL and Dependency Review. The org reusable workflow removed
# both (they need paid GitHub Advanced Security), so the run-codeql and
# run-dependency-review inputs are inert and are not passed. License and
# dependency-diff review for pull requests lives in dependency-review.yml.
name: Security Analysis

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run security scans weekly on Tuesday at 09:23 UTC
    - cron: '23 9 * * 2'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Uses org-level reusable workflow
jobs:
  security:
    name: Security Scan
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@79bf84c73af866a34f968262f2631f938c659d77  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      source-directory: 'src'
      python-version: '3.12'
      fail-on-high: true
      fail-on-medium: false
      run-bandit: true
      run-osv: true

  security-gate-success:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check security scan results
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$SECURITY_RESULT" == "success" ]; then
            echo "Security Gate passed"
          else
            echo "Security Gate failed: $SECURITY_RESULT"
            exit 1
          fi

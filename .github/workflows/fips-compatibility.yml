# FIPS Compatibility Check Workflow
# Checks code and dependencies for FIPS 140-2/140-3 compliance issues.
#
# FIPS (Federal Information Processing Standards) mode restricts cryptographic
# algorithms to NIST-approved ones. This is required for:
#   - US Government systems
#   - Healthcare (HIPAA)
#   - Financial services
#   - Ubuntu LTS with fips-updates package
#
# Features:
#   - Static analysis for non-FIPS crypto usage
#   - Dependency scanning for problematic packages
#   - Optional strict mode for zero-tolerance
name: FIPS Compatibility

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**/*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/fips-compatibility.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**/*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
  schedule:
    # Run weekly on Friday at 10:07 UTC
    - cron: '7 10 * * 5'
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Treat warnings as errors'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fips-check:
    name: FIPS Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run FIPS compatibility check
        id: fips-check
        env:
          STRICT_MODE: ${{ inputs.strict_mode }}
        # An explicit bash shell enables `-eo pipefail`; the default shell for
        # `run` steps does not, which is how the gate used to be dead.
        shell: bash
        run: |
          # Run the FIPS check script
          STRICT_FLAG=""
          if [[ "$STRICT_MODE" == "true" ]]; then
            STRICT_FLAG="--strict"
          fi

          # #CRITICAL: security: this step is the FIPS gate; its exit status
          # must be the checker's, not tee's.
          # #VERIFY: PIPESTATUS[0] holds the checker's status after the pipe;
          # the 'Check result' step fails the job when it is non-zero.
          set +e
          uv run --frozen python scripts/check_fips_compatibility.py \
            --fix-hints \
            --include-tests \
            $STRICT_FLAG \
            2>&1 | tee fips-report.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Also generate the JSON report. The checker exits 1 when it finds
          # errors but still writes the JSON, so its status is not used here;
          # the report itself is validated below instead.
          set +e
          uv run --frozen python scripts/check_fips_compatibility.py \
            --json \
            --include-tests \
            > fips-report.json
          set -e

          # #ASSUME: external resources: the JSON report is complete and
          # parseable. A crashed checker leaves it empty or truncated.
          # #VERIFY: fail closed (exit_code=1) when the summary counts are not
          # all numbers, instead of reporting a green run.
          if ! jq -e '.summary | [.errors, .warnings, .info] | all(type == "number")' \
              fips-report.json > /dev/null; then
            echo "::error::fips-report.json is missing or unparsable; treating the FIPS check as failed."
            EXIT_CODE=1
          else
            # Extract summary for PR comment
            {
              echo "errors=$(jq -r '.summary.errors' fips-report.json)"
              echo "warnings=$(jq -r '.summary.warnings' fips-report.json)"
              echo "info=$(jq -r '.summary.info' fips-report.json)"
            } >> "$GITHUB_OUTPUT"
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload FIPS report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fips-compatibility-report
          path: |
            fips-report.txt
            fips-report.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FIPS_ERRORS: ${{ steps.fips-check.outputs.errors }}
          FIPS_WARNINGS: ${{ steps.fips-check.outputs.warnings }}
          FIPS_INFO: ${{ steps.fips-check.outputs.info }}
          FIPS_EXIT_CODE: ${{ steps.fips-check.outputs.exit_code }}
        with:
          script: |
            const errors = parseInt(process.env.FIPS_ERRORS) || 0;
            const warnings = parseInt(process.env.FIPS_WARNINGS) || 0;
            const info = parseInt(process.env.FIPS_INFO) || 0;

            const checkFailed = process.env.FIPS_EXIT_CODE !== '0';

            let status = '✅ PASSED';
            let emoji = '✅';
            if (errors > 0 || checkFailed) {
              status = '❌ FAILED';
              emoji = '❌';
            } else if (warnings > 0) {
              status = '⚠️ NEEDS REVIEW';
              emoji = '⚠️';
            }

            const body = `## ${emoji} FIPS Compatibility Check

            | Metric | Count |
            |--------|-------|
            | Errors | ${errors} |
            | Warnings | ${warnings} |
            | Info | ${info} |

            **Status:** ${status}

            ${errors > 0 ? `⚠️ This PR introduces FIPS-incompatible code or dependencies. Please review the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.` : ''}
            ${warnings > 0 && errors === 0 ? 'ℹ️ Some packages may need verification for FIPS compliance. See the workflow artifacts for details.' : ''}

            <details>
            <summary>What is FIPS?</summary>

            FIPS 140-2/140-3 is a US government standard for cryptographic modules.
            Systems running Ubuntu LTS with \`fips-updates\` or similar configurations
            restrict cryptographic algorithms to NIST-approved ones.

            **Common issues:**
            - Using \`hashlib.md5()\` without \`usedforsecurity=False\`
            - Dependencies using non-approved algorithms (bcrypt, DES, RC4)
            - Weak cipher configurations

            </details>
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('FIPS Compatibility Check')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Check result
        if: steps.fips-check.outputs.exit_code != '0'
        run: |
          echo "::error::FIPS compatibility issues found. See the report for details."
          exit 1

  # Optional: Test on actual FIPS-enabled environment
  fips-runtime-test:
    name: FIPS Runtime Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || inputs.strict_mode
    needs: fips-check

    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Test crypto imports in simulated FIPS mode
        run: |
          # This tests if the code can import without using non-FIPS algorithms
          # Note: Full FIPS testing requires an actual FIPS-enabled kernel
          uv run --frozen python -c "
          import os
          import sys

          # Simulate FIPS mode check
          print('Testing crypto imports...')

          # Test hashlib with usedforsecurity parameter
          import hashlib
          try:
              # This should work - non-security use
              h = hashlib.md5(b'test', usedforsecurity=False)
              print('✓ hashlib.md5 with usedforsecurity=False works')
          except Exception as e:
              print(f'✗ hashlib.md5 error: {e}')
              sys.exit(1)

          # Test that SHA-256 works (FIPS approved)
          try:
              h = hashlib.sha256(b'test')
              print('✓ hashlib.sha256 works')
          except Exception as e:
              print(f'✗ hashlib.sha256 error: {e}')
              sys.exit(1)

          print('\\nBasic FIPS compatibility: PASSED')
          "

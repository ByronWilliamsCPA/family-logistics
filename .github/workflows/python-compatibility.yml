# Python Compatibility Matrix Testing for Family Logistics
# Tests the project across multiple Python versions and operating systems.
#
# This is a thin caller to the org-level reusable workflow.
name: Python Compatibility

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    # Weekly compatibility check on Sundays at 06:13 UTC
    - cron: '13 6 * * 0'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: python-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Python Compatibility Matrix
    permissions:
      contents: read
    uses: ByronWilliamsCPA/.github/.github/workflows/python-compatibility.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942  # main
    with:
      # requires-python is >=3.12,<3.14; the app ships as a Linux container.
      python-versions: '["3.12", "3.13"]'
      operating-systems: '["ubuntu-latest"]'
      include-macos: false
      include-windows: false
      source-directory: 'src'
      # No -m expression: the reusable workflow word-splits test-command, so a
      # quoted marker expression reached pytest as stray path arguments.
      test-command: 'pytest tests/ -v --tb=short -x --ignore=tests/integration'
      coverage-report: false
      fail-fast: false
      timeout-minutes: 30

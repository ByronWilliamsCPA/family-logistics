# PR Validation
# Pull-request checks that complement the main CI workflow:
#   - Conventional Commits PR title (python-semantic-release derives versions
#     and the changelog from it, so no per-PR CHANGELOG edit is required)
#   - Documentation link check (advisory)
#
# The org's python-pr-validation.yml was removed upstream; its checks now live
# in python-ci.yml (tests, coverage, dead code) and python-supplemental-checks.yml.
# Template sync is checked by validate-cruft.yml.
name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supplemental:
    name: Supplemental Checks
    uses: ByronWilliamsCPA/.github/.github/workflows/python-supplemental-checks.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942  # main
    permissions:
      contents: read
      pull-requests: write
    with:
      enable-commit-lint: true
      enable-link-check: true
      link-check-fail: false
      enable-changelog-check: false
      enable-cruft-check: false
      enable-automerge: false

  # Name is a required status check in the organization ruleset; keep it.
  validate-dependencies:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    needs: [supplemental]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check validation results
        env:
          SUPPLEMENTAL_RESULT: ${{ needs.supplemental.result }}
        run: |
          {
            echo "## Dependency & Standards Validation"
            echo ""
            echo "Supplemental checks: ${SUPPLEMENTAL_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SUPPLEMENTAL_RESULT" != "success" ]; then
            echo "::error::Supplemental PR checks did not pass (${SUPPLEMENTAL_RESULT})."
            exit 1
          fi

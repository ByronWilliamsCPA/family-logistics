# PR Validation
# Pull-request checks that complement the main CI workflow:
#   - Conventional Commits PR title (python-semantic-release derives versions
#     and the changelog from it, so no per-PR CHANGELOG edit is required)
#   - Documentation link check (advisory)
#
# The org's python-pr-validation.yml still exists but is marked DEPRECATED
# ("will be removed in a future release"), so this repo no longer builds on it.
# Its checks moved as follows:
#   tests, coverage threshold, dead code (advisory)  python-ci.yml
#   Conventional Commits title                       commit-lint below
#   documentation links                              link check below (advisory)
#   CHANGELOG-updated gate                           dropped on purpose:
#                                                    python-semantic-release writes it
#   template sync                                    validate-cruft.yml
# Dropped without a replacement: the minimum PR description length and the
# breaking-change body check. Breaking changes are still surfaced because the
# commit-lint title check accepts the `!` marker that semantic-release reads.
name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supplemental:
    name: Supplemental Checks
    uses: ByronWilliamsCPA/.github/.github/workflows/python-supplemental-checks.yml@82ce497cae146787ea65bf892aedfe3262a4638e  # main
    permissions:
      contents: read
      pull-requests: write
    with:
      enable-commit-lint: true
      enable-link-check: true
      link-check-fail: false
      enable-changelog-check: false
      enable-cruft-check: false
      enable-automerge: false

  # Name is a required status check in the organization ruleset; keep it so
  # branch protection keeps matching. What it gates today is exactly the
  # supplemental job above: commit-lint (blocking) and the link check (not
  # blocking, link-check-fail is false). Tests, coverage, lint and types are
  # gated by "CI Gate" (ci.yml) and household data by Private Data Guard; those
  # are separate status checks, so the ruleset must require them by name for
  # them to block a merge. Renaming this job needs a matching ruleset change by
  # a repo admin.
  validate-dependencies:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    needs: [supplemental]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check validation results
        env:
          SUPPLEMENTAL_RESULT: ${{ needs.supplemental.result }}
        run: |
          {
            echo "## Dependency & Standards Validation"
            echo ""
            echo "Supplemental checks: ${SUPPLEMENTAL_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SUPPLEMENTAL_RESULT" != "success" ]; then
            echo "::error::Supplemental PR checks did not pass (${SUPPLEMENTAL_RESULT})."
            exit 1
          fi

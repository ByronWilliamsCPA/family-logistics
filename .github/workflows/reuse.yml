# REUSE Compliance Check
# Verifies every file carries copyright and licensing information
# (https://reuse.software). Annotations for files that cannot carry a header
# live in REUSE.toml.
name: REUSE Compliance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reuse:
    # Name is a required status check in the organization ruleset; keep it.
    name: Check REUSE Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Generate REUSE SPDX
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
        with:
          args: spdx --output reuse-spdx.json

      - name: Upload REUSE SPDX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reuse-spdx
          path: reuse-spdx.json
          retention-days: 90

name: Validate Cruft Status

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Run weekly on Thursday at 09:41 UTC
    - cron: '41 9 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cruft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # cruft and its whole dependency tree are pinned with hashes
      # (.github/requirements/cruft.txt, compiled from cruft.in with
      # `uv pip compile --universal --generate-hashes`), so a tampered or
      # newly published transitive release cannot be installed unnoticed.
      - name: Install cruft
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r .github/requirements/cruft.txt

      - name: Check for manual .cruft.json edits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          if git diff HEAD^ HEAD --name-only | grep -q '\.cruft\.json'; then
            # .cruft.json was changed
            changed_files=$(git diff HEAD^ HEAD --name-only | wc -l)
            cruft_only=$(git diff HEAD^ HEAD --name-only | grep -c '\.cruft\.json' || true)

            if [ "$changed_files" -eq 1 ] && [ "$cruft_only" -eq 1 ]; then
              echo "❌ ERROR: Only .cruft.json was modified"
              echo ""
              echo "This suggests manual editing instead of running 'cruft update'."
              echo ""
              echo "To fix:"
              echo "  1. Revert the manual edit: git checkout HEAD^ -- .cruft.json"
              echo "  2. Run: cruft update"
              echo "  3. Review changes: git diff"
              echo "  4. Commit if successful: git add . && git commit -m 'chore: update from template'"
              exit 1
            fi
          fi

      # Fails on every event, scheduled runs included: a failed weekly run is
      # the notification that the project has drifted from the template.
      - name: Verify cruft status
        id: verify-cruft
        run: |
          echo "Checking if project is in sync with template..."
          if cruft check; then
            echo "✅ Project is up to date with template"
          else
            echo "⚠️  Project is out of sync with template"
            echo ""
            echo "To update:"
            echo "  cruft diff   # Preview changes"
            echo "  cruft update # Apply changes"
            echo ""
            echo "::error::Project has drifted from the cookiecutter template; failing so that out-of-date code is not merged and drift is noticed."
            exit 1
          fi

      - name: Show template diff (if out of sync)
        if: failure() && steps.verify-cruft.outcome == 'failure'
        run: |
          echo "Template changes that need to be applied:"
          cruft diff || true

      - name: Check for orphaned conditional files
        id: orphaned-files
        run: |
          echo "Checking for orphaned conditional files..."
          echo ""
          echo "Note: Cruft update only syncs file contents - it does NOT re-run"
          echo "post-generation hooks that clean up conditional files."
          echo ""
          python scripts/check_orphaned_files.py
        continue-on-error: false

      - name: Orphaned files fix instructions
        if: failure() && steps.orphaned-files.outcome == 'failure'
        run: |
          echo ""
          echo "=========================================="
          echo "HOW TO FIX ORPHANED FILES"
          echo "=========================================="
          echo ""
          echo "Option 1 - Automated cleanup:"
          echo "  python scripts/cleanup_conditional_files.py"
          echo ""
          echo "Option 2 - Manual cleanup:"
          echo "  Delete the orphaned files/directories listed above"
          echo ""
          echo "After cleanup, commit the changes:"
          echo "  git add -A"
          echo "  git commit -m 'chore: remove orphaned conditional files'"
          echo ""

# Family Logistics - SonarCloud Analysis
# Thin caller for the organization's reusable SonarCloud workflow.
#
# The reusable workflow (pinned below) uses sonarqube-scan-action v8.2, which
# resolves the /analysis/analyses 404 bug encountered with v4.x on new projects.
#
# SonarCloud Dashboard: https://sonarcloud.io/dashboard?id=ByronWilliamsCPA_family-logistics
#
# Note: This workflow requires the SONAR_TOKEN secret. It fails when the token
# is missing, except on fork pull requests, which never receive secrets.
name: SonarCloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    permissions:
      contents: read
      pull-requests: write
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sonarcloud.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942  # main
    with:
      sonar-organization: 'byronwilliamscpa'
      sonar-project-key: 'ByronWilliamsCPA_family-logistics'
      python-version: '3.12'
      source-directory: 'src'
      coverage-paths: 'coverage.xml'
      # Enforce the quality gate on pull requests too, so a failing gate blocks
      # before merge rather than after.
      fail-on-quality-gate: true
      # #ASSUME: external resources: SONAR_TOKEN is available to this repository.
      # #VERIFY: a same-repository pull request run fails, not skips, when it is
      # missing; only fork pull requests (no secrets) are allowed to skip.
      skip-if-no-token: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      # The project installs as an editable package for coverage; the
      # upstream default (true) would stop 'uv sync' from installing it.
      no-build: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

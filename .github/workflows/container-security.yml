# Container Security Scanning for Family Logistics
# Scans Docker images for vulnerabilities using Trivy and lints Dockerfile with Hadolint.
#
# This is a thin caller to the org-level reusable workflow.
name: Container Security

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    # Weekly scan on Wednesdays at 7 AM UTC
    - cron: '29 7 * * 3'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: container-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-security:
    name: Container Security Scan
    permissions:
      contents: read
      security-events: write
    uses: ByronWilliamsCPA/.github/.github/workflows/python-container-security.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942  # main
    with:
      dockerfile-path: 'Dockerfile'
      build-context: '.'
      image-tag: 'family-logistics:scan'
      build-image: true
      severity-threshold: 'CRITICAL,HIGH'
      fail-on-vulnerabilities: true
      # Base-image CVEs with no upstream fix cannot be patched here; they are
      # retired by refreshing the digest-pinned DHI base image.
      ignore-unfixed: true
      # Bases come from the public GHCR DHI mirror, not dhi.io.
      enable-dhi-login: false
      run-hadolint: true
      hadolint-failure-threshold: 'warning'
      generate-sbom: true
      upload-sarif: true
      artifact-retention-days: 90

# Container Security Scanning for Family Logistics
# Scans Docker images for vulnerabilities using Trivy and lints Dockerfile with Hadolint.
#
# This is a thin caller to the org-level reusable workflow.
name: Container Security

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    # Weekly scan on Wednesdays at 07:29 UTC
    - cron: '29 7 * * 3'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: container-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-security:
    name: Container Security Scan
    permissions:
      contents: read
    uses: ByronWilliamsCPA/.github/.github/workflows/python-container-security.yml@82ce497cae146787ea65bf892aedfe3262a4638e  # main
    with:
      dockerfile-path: 'Dockerfile'
      build-context: '.'
      image-tag: 'family-logistics:scan'
      build-image: true
      severity-threshold: 'CRITICAL,HIGH'
      fail-on-vulnerabilities: true
      # Pull requests and pushes gate on fixable findings only. The weekly and
      # manual runs report the full inventory, including base-image CVEs with
      # no upstream fix yet, which is the only ongoing monitor of the pinned
      # DHI base digests.
      ignore-unfixed: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
      # Bases come from the public GHCR DHI mirror, not dhi.io.
      enable-dhi-login: false
      run-hadolint: true
      hadolint-failure-threshold: 'warning'
      generate-sbom: true
      artifact-retention-days: 90

# Documentation Workflow
# Builds and deploys MkDocs documentation to GitHub Pages.
#
# Features:
#   - MkDocs Material theme build
#   - GitHub Pages deployment (disabled until Pages is enabled)
#   - PR preview builds
name: Documentation

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Uses org-level reusable workflow
jobs:
  docs:
    name: Build & Deploy Docs
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ByronWilliamsCPA/.github/.github/workflows/python-docs.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942  # main
    with:
      python-version: '3.12'
      # Build-only until GitHub Pages is enabled for the repository (an admin
      # setting). Then restore: deploy on push to main.
      deploy-to-pages: false

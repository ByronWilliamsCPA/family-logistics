# REUSE configuration (https://reuse.software, specification 3.3).
#
# Files that cannot carry an SPDX header are annotated here by glob. Code is
# MIT, prose documentation is CC-BY-4.0, and configuration, lock files and
# generated or placeholder files are CC0-1.0. Only these three license texts
# live in LICENSES/; `reuse lint` fails on unused license texts.
version = 1
SPDX-PackageName = "family-logistics"
SPDX-PackageSupplier = "Byron Williams"
SPDX-PackageDownloadLocation = "https://github.com/ByronWilliamsCPA/family-logistics"

# Source code, tests, tooling and scripts - MIT
[[annotations]]
path = [
    "src/**",
    "tests/**",
    "tools/**",
    "typings/**",
    "scripts/**/*.py",
    ".claude/**/*.py",
    "*.py",
    "Dockerfile",
]
SPDX-License-Identifier = "MIT"
SPDX-FileCopyrightText = "2026 Byron Williams"

# Prose documentation - CC-BY-4.0
[[annotations]]
path = [
    "docs/**",
    "*.md",
    "scripts/**/*.md",
    "!LICENSES/*.txt",
]
SPDX-License-Identifier = "CC-BY-4.0"
SPDX-FileCopyrightText = "2026 Byron Williams"

# Configuration, metadata, lock files and placeholders - CC0-1.0
[[annotations]]
path = [
    "*.toml",
    "*.yml",
    "*.yaml",
    "*.json",
    "uv.lock",
    ".github/**",
    ".claude/**",
    ".standards/**",
    ".qlty/**",
    ".gitignore",
    ".gitattributes",
    ".dockerignore",
    ".editorconfig",
    ".env.example",
    ".cruft.json",
    ".infisical.json",
    ".markdownlint.json",
    ".markdownlintignore",
    ".mutmut_config",
    ".prettierrc",
    ".secrets.baseline",
    ".shellcheckrc",
    ".yamllint",
    ".gitleaks.toml",
    "sonar-project.properties",
    "overrides/**",
    "configs/**",
    "data/.gitkeep",
    "scripts/**/*.sh",
    "scripts/.gitkeep",
]
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2026 Byron Williams"

# Build output and caches, if they are ever present in a working tree.
[[annotations]]
path = [
    "build/**",
    "dist/**",
    "site/**",
    "*.egg-info/**",
    "**/__pycache__/**",
    ".venv/**",
    ".nox/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
]
precedence = "override"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2026 Byron Williams"

# Gitleaks configuration for a PUBLIC repository.
#
# Extends the default ruleset with rules for household data that must never
# be committed: private network addresses, personal e-mail addresses, phone
# numbers and street addresses. Real names are caught separately by
# scripts/check_private_terms.py, whose deny-list lives outside the repository.

title = "family-logistics"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4-address"
description = "RFC 1918 address (site network details belong in the private deployment repository)"
regex = '''\b(?:10\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.\d{1,3}\.\d{1,3}\b'''
keywords = ["10.", "172.", "192.168."]
[rules.allowlist]
# 10.0.0.x is RFC 1918 private space, not a documentation range. It is
# allowlisted only because generic examples and tests use it; real site
# addresses must stay out of the repository and any other private range fails.
regexes = ['''\b10\.0\.0\.\d{1,3}\b''']

[[rules]]
id = "personal-email-address"
description = "Personal e-mail address"
regex = '''\b[A-Za-z0-9._%+-]+@(?:gmail|icloud|me|mac|yahoo|outlook|hotmail|aol|proton|protonmail)\.(?:com|me|ch)\b'''
keywords = ["@"]

[[rules]]
id = "us-phone-number"
description = "US phone number"
regex = '''(?:\+1[\s.-]?)?\(?\b[2-9]\d{2}\)?[\s.-]\d{3}[\s.-]\d{4}\b'''
keywords = ["-", ".", " "]
[rules.allowlist]
# The 555-01xx block is reserved for fiction.
regexes = ['''555[\s.-]01\d{2}''']

[[rules]]
id = "street-address"
description = "Street address"
regex = '''\b\d{1,6}\s+(?:[NSEW]\.?\s+)?[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\s+(?:St|Street|Ave|Avenue|Rd|Road|Dr|Drive|Blvd|Boulevard|Ln|Lane|Ct|Court|Way|Pl|Place|Ter|Terrace|Cir|Circle|Pkwy|Parkway)\b\.?'''
keywords = ["st", "ave", "rd", "dr", "blvd", "ln", "ct", "way", "pl", "ter", "cir", "pkwy", "street", "avenue", "road", "drive", "lane", "court", "place"]
[rules.allowlist]
# Fictional fixtures use streets named "Example" or "Sample". A real street with
# one of those names would be allowlisted too (the accepted trade-off), so keep
# this pattern narrow: widen it only with a documented reason. The allowlist
# matches the rule's secret, which is the whole address (the rule has no
# capture groups), so it cannot hide a different address on the same line.
regexes = ['''\b\d{1,6}\s+(?:Example|Sample)\s+[A-Z][a-z]+\b''']

[allowlist]
description = "Lock files and generated artifacts"
paths = ['''uv\.lock$''', '''\.secrets\.baseline$''']
